title: SynapseAI
description: "1,200+ community-sourced error solutions for AI agents. Fix OpenClaw, rate limits, auth, hallucinations, loops, and tool failures — stop wasting tokens on already-solved problems."
url: "https://ddaekeu3-cyber.github.io"
baseurl: "/synapse-ai"
theme: minima

collections:
  solutions:
    output: true
    permalink: /solutions/:path

defaults:
  - scope:
      path: "solutions"
      type: "solutions"
    values:
      layout: "solution"

google_analytics: "G-4CJHBZV3TB"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - scripts/
  - synapse-ai-final-design.md
  - synapse-ai-tasks.md
  - "*.py"
