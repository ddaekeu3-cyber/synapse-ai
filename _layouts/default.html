<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-PGTBT7HN');</script>
  <!-- End Google Tag Manager -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% seo %}
  <!-- Google Analytics 4 (GA4) -->
  {% if site.google_analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}', {
      send_page_view: true,
      cookie_flags: 'SameSite=None;Secure'
    });
    // Enhanced measurement: scroll, outbound clicks, site search
    gtag('config', '{{ site.google_analytics }}', {
      'enhanced_measurement': {
        'scroll': true,
        'outbound_clicks': true,
        'site_search': true,
        'page_changes': true
      }
    });
  </script>
  {% endif %}
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --green: #3fb950;
      --orange: #d29922;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    header {
      border-bottom: 1px solid var(--border);
      padding: 20px 0;
      margin-bottom: 30px;
    }
    header h1 a {
      color: var(--accent);
      text-decoration: none;
      font-size: 1.5rem;
    }
    header h1 a:hover { color: var(--accent-hover); }
    header p { color: var(--text-muted); margin-top: 4px; }
    nav { margin-top: 10px; }
    nav a {
      color: var(--text-muted);
      text-decoration: none;
      margin-right: 16px;
      font-size: 0.9rem;
    }
    nav a:hover { color: var(--accent); }
    h1, h2, h3 { margin: 1.2em 0 0.6em; }
    h1 { font-size: 1.8rem; }
    h2 { font-size: 1.3rem; color: var(--accent); }
    p, li { margin-bottom: 0.5em; }
    a { color: var(--accent); }
    a:hover { color: var(--accent-hover); }
    code {
      background: var(--surface);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    pre {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 1em 0;
    }
    pre code { background: none; padding: 0; }
    .search-box {
      width: 100%;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 24px;
    }
    .search-box:focus { outline: none; border-color: var(--accent); }
    .search-box::placeholder { color: var(--text-muted); }
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
      margin: 24px 0;
    }
    .category-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      text-decoration: none;
      transition: border-color 0.2s;
    }
    .category-card:hover { border-color: var(--accent); }
    .category-card h3 { color: var(--text); margin: 0 0 8px; }
    .category-card p { color: var(--text-muted); font-size: 0.9rem; margin: 0; }
    .solution-list { list-style: none; }
    .solution-list li {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .solution-list a { text-decoration: none; }
    .solution-list a:hover { text-decoration: underline; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .cta-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin: 32px 0;
      text-align: center;
    }
    .cta-box h3 { color: var(--green); margin-bottom: 12px; }
    .cta-box code {
      display: inline-block;
      padding: 8px 16px;
      font-size: 1rem;
      margin: 8px 0;
    }
    .stats {
      display: flex;
      gap: 24px;
      margin: 20px 0;
    }
    .stat {
      text-align: center;
    }
    .stat .number {
      font-size: 2rem;
      font-weight: bold;
      color: var(--green);
    }
    .stat .label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    footer {
      border-top: 1px solid var(--border);
      margin-top: 40px;
      padding: 20px 0;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PGTBT7HN"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <div class="container">
    <header>
      <h1><a href="{{ site.baseurl }}/">SynapseAI</a></h1>
      <p>에이전트의 삽질을 줄여서 토큰을 아껴주는 솔루션 DB</p>
      <nav>
        <a href="{{ site.baseurl }}/">Home</a>
        <a href="{{ site.baseurl }}/guide/token-saving">Token Saving Guide</a>
        <a href="{{ site.baseurl }}/contribute">Contribute</a>
        <a href="https://github.com/ddaekeu3-cyber/synapse-ai">GitHub</a>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer>
      <p>&copy; 2026 SynapseAI. MIT License. Built for AI agents, by humans.</p>
    </footer>
  </div>
</body>
</html>
